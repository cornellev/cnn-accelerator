[project]
name = "mnist-cnn"
version = "0.1.0"
description = "A small two-layer convolutional model for MNIST"
requires-python = ">=3.11"
dependencies = [
    "tabulate>=0.10.0",
    "torch>=2.4",
    "torchao>=0.14",
    "torchvision>=0.19",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "debugpy>=1.8.22",
    "pytest>=9.1.1",
]
